<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laporan Pemesanan - BOOKSPACE</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="konten">
    <header class="header"><h1>Laporan Pemesanan</h1></header>
    <section class="grid" id="ringkasan"></section>
    <section class="kartu"><div class="toolbar"><select id="filterStatus"><option value="">Semua Status</option><option>Diproses</option><option>Dikirim</option><option>Selesai</option></select></div>
      <div class="tabel-wrap"><table><thead><tr><th>No. Pesanan</th><th>Pembeli</th><th>Tanggal</th><th>Jumlah Buku</th><th>Total</th><th>Status</th></tr></thead><tbody id="tabelLaporan"></tbody></table></div></section>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/laporan.js"></script>
</body>
</html>
